<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전기기사 CBT 모의고사</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2430;--bd:#d6dbe3;--pr:#1d4ed8;--sel:#dbeafe;--ok:#15803d;--no:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2230;--tx:#e8ecf4;--bd:#2d384f;--pr:#6b9bff;--sel:#1e3a6e;--ok:#4ade80;--no:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:12px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;cursor:pointer}
button.main{background:var(--pr);color:#fff;border-color:var(--pr)}
.top{display:flex;justify-content:space-between;align-items:center}
#time{font-weight:700;font-size:1.2rem}
.ch{display:block;width:100%;text-align:left;margin:8px 0}
.sel{background:var(--sel);border-color:var(--pr)}
.ok{border-color:var(--ok);background:rgba(34,197,94,.15)}
.no{border-color:var(--no);background:rgba(239,68,68,.15)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{width:42px;padding:8px 0}
.nums .done{background:var(--sel)}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.pass{color:var(--ok)}.fail{color:var(--no)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.exp{margin-top:8px;font-size:.95rem;opacity:.9}
</style>
</head>
<body>
<main id="app"></main>

<!-- 문제 데이터: answer는 정답 번호(1~4). 문제를 늘리려면 questions 배열에 같은 형식으로 추가하세요. -->
<script type="application/json" id="data">
{
 "config": {
  "title": "전기기사 필기 CBT 모의고사",
  "durationMin": 30,
  "passAvg": 60,
  "passSubjectMin": 40
 },
 "questions": [
  {
   "id": 1,
   "subject": "전기자기학",
   "question": "진공 중에서 두 점전하 사이의 거리를 2배로 하면 두 전하 사이에 작용하는 힘은 몇 배가 되는가?",
   "choices": [
    "2배",
    "4배",
    "1/2배",
    "1/4배"
   ],
   "answer": 4,
   "explanation": "쿨롱의 법칙 F = Q₁Q₂ / (4πε₀r²) 에서 힘은 거리의 제곱에 반비례하므로 r이 2배면 F는 1/4배가 됩니다."
  },
  {
   "id": 2,
   "subject": "전기자기학",
   "question": "평행판 콘덴서에서 극판의 면적을 2배로, 극판 간격을 2배로 하면 정전용량은 어떻게 되는가?",
   "choices": [
    "4배",
    "2배",
    "변화 없다",
    "1/2배"
   ],
   "answer": 3,
   "explanation": "C = εS/d 이므로 S와 d가 모두 2배가 되면 (2/2)=1, 즉 정전용량은 변하지 않습니다."
  },
  {
   "id": 3,
   "subject": "전기자기학",
   "question": "자속밀도의 단위 1[T](테슬라)와 같은 것은?",
   "choices": [
    "A/m",
    "Wb/m²",
    "N/C",
    "H/m"
   ],
   "answer": 2,
   "explanation": "자속밀도 B의 단위는 [Wb/m²]이며 이를 테슬라[T]라 합니다. A/m는 자계의 세기, H/m는 투자율의 단위입니다."
  },
  {
   "id": 4,
   "subject": "전력공학",
   "question": "송전선로에서 코로나 방지에 가장 효과적인 방법은?",
   "choices": [
    "단도체를 사용한다",
    "가는 전선을 사용한다",
    "복도체를 사용한다",
    "전선 간격을 좁힌다"
   ],
   "answer": 3,
   "explanation": "코로나 임계전압을 높이려면 전선 표면의 전위경도를 낮춰야 합니다. 굵은 전선이나 복도체(다도체)를 사용하면 효과적입니다."
  },
  {
   "id": 5,
   "subject": "전력공학",
   "question": "같은 전력을 같은 역률로 송전할 때, 송전전압을 2배로 높이면 전력손실은 몇 배가 되는가?",
   "choices": [
    "1/2배",
    "1/4배",
    "2배",
    "4배"
   ],
   "answer": 2,
   "explanation": "I = P/(√3·V·cosθ) 이므로 전압이 2배면 전류는 1/2배, 손실 3I²R은 전류의 제곱에 비례하여 1/4배가 됩니다."
  },
  {
   "id": 6,
   "subject": "전력공학",
   "question": "무부하 또는 경부하 시 송전선로의 수전단 전압이 송전단 전압보다 높아지는 페란티 현상의 주된 원인은?",
   "choices": [
    "선로의 저항",
    "선로의 누설 컨덕턴스",
    "선로의 정전용량",
    "선로의 인덕턴스"
   ],
   "answer": 3,
   "explanation": "장거리 선로의 충전전류(진상전류)가 선로 인덕턴스를 지나며 전압 상승을 일으키는 현상으로, 원인은 선로의 정전용량입니다."
  },
  {
   "id": 7,
   "subject": "전기기기",
   "question": "1차 전압 6600[V], 2차 전압 220[V]인 단상 변압기의 권수비는?",
   "choices": [
    "10",
    "20",
    "30",
    "60"
   ],
   "answer": 3,
   "explanation": "권수비 a = N₁/N₂ = V₁/V₂ = 6600/220 = 30 입니다."
  },
  {
   "id": 8,
   "subject": "전기기기",
   "question": "60[Hz], 4극 3상 유도전동기의 동기속도[rpm]는?",
   "choices": [
    "900",
    "1200",
    "1800",
    "3600"
   ],
   "answer": 3,
   "explanation": "Ns = 120f/P = 120×60/4 = 1800[rpm] 입니다."
  },
  {
   "id": 9,
   "subject": "전기기기",
   "question": "직류 분권전동기의 속도제어법 중 정토크 제어에 해당하는 것은?",
   "choices": [
    "계자 제어",
    "전압 제어",
    "극수 변환",
    "주파수 제어"
   ],
   "answer": 2,
   "explanation": "직류전동기에서 전압 제어는 정토크 제어, 계자 제어는 정출력 제어 특성을 가집니다. 극수 변환과 주파수 제어는 유도전동기 방식입니다."
  },
  {
   "id": 10,
   "subject": "회로이론 및 제어공학",
   "question": "R=3[Ω], X_L=4[Ω]인 RL 직렬회로의 임피던스 크기는?",
   "choices": [
    "1[Ω]",
    "5[Ω]",
    "7[Ω]",
    "12[Ω]"
   ],
   "answer": 2,
   "explanation": "|Z| = √(R² + X_L²) = √(3² + 4²) = 5[Ω] 입니다."
  },
  {
   "id": 11,
   "subject": "회로이론 및 제어공학",
   "question": "RL 직렬회로의 시정수 τ는?",
   "choices": [
    "R/L",
    "L/R",
    "RL",
    "1/(RL)"
   ],
   "answer": 2,
   "explanation": "RL 회로의 시정수는 τ = L/R [s] 입니다. (RC 회로는 τ = RC)"
  },
  {
   "id": 12,
   "subject": "회로이론 및 제어공학",
   "question": "전달함수 G(s) = 1/(s+2) 인 시스템에 단위계단 입력을 가했을 때 출력의 정상값(최종값)은?",
   "choices": [
    "0",
    "1/2",
    "1",
    "2"
   ],
   "answer": 2,
   "explanation": "C(s) = 1/[s(s+2)] 이고 최종값 정리에 따라 lim s·C(s) = 1/(0+2) = 1/2 입니다."
  },
  {
   "id": 13,
   "subject": "전기설비기술기준",
   "question": "한국전기설비규정(KEC)에서 정하는 저압의 범위는?",
   "choices": [
    "직류 750[V] 이하, 교류 600[V] 이하",
    "직류 1.5[kV] 이하, 교류 1[kV] 이하",
    "직류 1[kV] 이하, 교류 1.5[kV] 이하",
    "직류 3[kV] 이하, 교류 1.5[kV] 이하"
   ],
   "answer": 2,
   "explanation": "KEC 전압 구분: 저압은 직류 1.5kV 이하, 교류 1kV 이하입니다. 고압은 저압을 초과하고 7kV 이하, 특고압은 7kV 초과입니다."
  },
  {
   "id": 14,
   "subject": "전기설비기술기준",
   "question": "KEC에서 특고압으로 구분되는 전압은?",
   "choices": [
    "600[V] 초과",
    "1[kV] 초과",
    "7[kV] 초과",
    "35[kV] 초과"
   ],
   "answer": 3,
   "explanation": "7kV를 초과하는 전압이 특고압입니다."
  },
  {
   "id": 15,
   "subject": "전기설비기술기준",
   "question": "KEC에서 교류 3상 회로의 L1상 전선의 색상은?",
   "choices": [
    "갈색",
    "흑색",
    "회색",
    "청색"
   ],
   "answer": 1,
   "explanation": "KEC 전선 색상: L1 갈색, L2 흑색, L3 회색, N 청색, 보호도체 녹색-노란색입니다."
  }
 ]
}
</script>

<script>
const D=JSON.parse(document.getElementById("data").textContent),Q=D.questions,C=D.config;
const app=document.getElementById("app"),N=["①","②","③","④"];
let ans=Array(Q.length).fill(0),cur=0,left=C.durationMin*60,timer;

function mmss(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function start(){
  ans.fill(0);cur=0;left=C.durationMin*60;
  clearInterval(timer);
  timer=setInterval(()=>{left--;document.getElementById("time").textContent=mmss(left);if(left<=0)finish()},1000);
  show();
}

function show(){
  const q=Q[cur];
  app.innerHTML=`
  <div class="top"><span id="time">${mmss(left)}</span><button class="main" onclick="ask()">제출</button></div>
  <div class="card">
    <small>${q.subject}</small>
    <p><b>${cur+1}. ${q.question}</b></p>
    ${q.choices.map((c,i)=>`<button class="ch ${ans[cur]==i+1?"sel":""}" onclick="pick(${i+1})">${N[i]} ${c}</button>`).join("")}
    <div class="nav">
      <button onclick="go(-1)" ${cur==0?"disabled":""}>← 이전</button>
      <button onclick="go(1)" ${cur==Q.length-1?"disabled":""}>다음 →</button>
    </div>
  </div>
  <div class="card nums">${Q.map((_,i)=>`<button class="${ans[i]?"done":""}" onclick="cur=${i};show()">${i+1}</button>`).join("")}</div>`;
}

function pick(n){ans[cur]=ans[cur]==n?0:n;show()}
function go(d){cur+=d;show()}
function ask(){
  const left0=ans.filter(a=>!a).length;
  if(confirm(left0?`풀지 않은 문제가 ${left0}개 있습니다. 제출할까요?`:"제출할까요?"))finish();
}

function finish(){
  clearInterval(timer);
  const sub={};
  Q.forEach((q,i)=>{sub[q.subject]=sub[q.subject]||[0,0];sub[q.subject][1]++;if(ans[i]==q.answer)sub[q.subject][0]++});
  const rows=Object.entries(sub).map(([k,[c,n]])=>[k,c,n,c/n*100]);
  const avg=rows.reduce((s,r)=>s+r[3],0)/rows.length;
  const pass=avg>=C.passAvg&&rows.every(r=>r[3]>=C.passSubjectMin);
  app.innerHTML=`
  <div class="card">
    <h2 class="${pass?"pass":"fail"}">${pass?"합격":"불합격"} · 평균 ${avg.toFixed(1)}점</h2>
    <table><tr><th>과목</th><th>정답</th><th>점수</th></tr>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}/${r[2]}</td><td class="${r[3]<C.passSubjectMin?"fail":""}">${r[3].toFixed(1)}${r[3]<C.passSubjectMin?" (과락)":""}</td></tr>`).join("")}</table>
    <p><button class="main" onclick="start()">다시 풀기</button></p>
  </div>
  ${Q.map((q,i)=>`<div class="card">
    <b class="${ans[i]==q.answer?"pass":"fail"}">${ans[i]==q.answer?"정답":ans[i]?"오답":"미응답"}</b>
    <p><b>${i+1}. ${q.question}</b></p>
    ${q.choices.map((c,j)=>`<div class="ch ${j+1==q.answer?"ok":j+1==ans[i]?"no":""}" style="padding:8px 12px;border:1px solid var(--bd);border-radius:8px">${N[j]} ${c}</div>`).join("")}
    <div class="exp">해설: ${q.explanation}</div></div>`).join("")}`;
  window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
