<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전기기사 CBT 모의고사</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#667085;--bd:#d9dee8;--pr:#1d4ed8;--prt:#fff;--ok:#15803d;--no:#b91c1c;--okb:#dcfce7;--nob:#fee2e2;--sel:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#18202f;--tx:#e8ecf4;--mu:#94a0b8;--bd:#2c3750;--pr:#6b9bff;--prt:#0b1020;--ok:#4ade80;--no:#f87171;--okb:#12341f;--nob:#3b1517;--sel:#1e3a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--tx:#e8ecf4;--mu:#94a0b8;--bd:#2c3750;--pr:#6b9bff;--prt:#0b1020;--ok:#4ade80;--no:#f87171;--okb:#12341f;--nob:#3b1517;--sel:#1e3a6e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.92rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 16px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem;padding:6px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.timer.low{color:var(--no);border-color:var(--no)}
.sub{display:inline-block;font-size:.8rem;background:var(--sel);padding:2px 10px;border-radius:99px;margin-bottom:8px}
.q{font-size:1.08rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.ch{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;line-height:1.5}
.ch.sel{background:var(--sel);border-color:var(--pr)}
.ch.ok{background:var(--okb);border-color:var(--ok)}.ch.no{background:var(--nob);border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid button{padding:8px 0;font-size:.9rem}
.grid .dn{background:var(--sel);border-color:var(--pr)}.grid .cur{outline:2px solid var(--pr)}.grid .fl::after{content:"★";font-size:.7rem;color:var(--no)}
.score{font-size:2.4rem;font-weight:800}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.pass{color:var(--ok)}.fail{color:var(--no)}
.exp{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hide{display:none}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:360px}
.in{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"><p id="dmsg"></p><div class="row" style="justify-content:flex-end"><button id="dno">취소</button><button class="p" id="dyes">제출</button></div></dialog>

<!-- ▼ 문제 데이터 (코드와 분리). 별도 questions.json 파일로 옮겨도 동작합니다. answer는 1~4 -->
<script type="application/json" id="qdata">
{
"config":{"title":"전기기사 필기 CBT 모의고사","durationMin":30,"passAvg":60,"passSubjectMin":40},
"questions":[
{"id":1,"subject":"전기자기학","question":"진공 중에서 두 점전하 사이의 거리를 2배로 하면 두 전하 사이에 작용하는 힘은 몇 배가 되는가?","choices":["2배","4배","1/2배","1/4배"],"answer":4,"explanation":"쿨롱의 법칙 F = Q₁Q₂ / (4πε₀r²) 에서 힘은 거리의 제곱에 반비례하므로 r이 2배면 F는 1/4배가 됩니다."},
{"id":2,"subject":"전기자기학","question":"평행판 콘덴서에서 극판의 면적을 2배로, 극판 간격을 2배로 하면 정전용량은 어떻게 되는가?","choices":["4배","2배","변화 없다","1/2배"],"answer":3,"explanation":"C = εS/d 이므로 S와 d가 모두 2배가 되면 (2/2)=1, 즉 정전용량은 변하지 않습니다."},
{"id":3,"subject":"전기자기학","question":"자속밀도의 단위 1[T](테슬라)와 같은 것은?","choices":["A/m","Wb/m²","N/C","H/m"],"answer":2,"explanation":"자속밀도 B의 단위는 [Wb/m²]이며 이를 테슬라[T]라 합니다. A/m는 자계의 세기, H/m는 투자율의 단위입니다."},
{"id":4,"subject":"전력공학","question":"송전선로에서 코로나 방지에 가장 효과적인 방법은?","choices":["단도체를 사용한다","가는 전선을 사용한다","복도체를 사용한다","전선 간격을 좁힌다"],"answer":3,"explanation":"코로나 임계전압을 높이려면 전선 표면의 전위경도를 낮춰야 합니다. 굵은 전선이나 복도체(다도체)를 사용하면 효과적입니다."},
{"id":5,"subject":"전력공학","question":"같은 전력을 같은 역률로 송전할 때, 송전전압을 2배로 높이면 전력손실은 몇 배가 되는가?","choices":["1/2배","1/4배","2배","4배"],"answer":2,"explanation":"I = P/(√3·V·cosθ) 이므로 전압이 2배면 전류는 1/2배, 손실 3I²R은 전류의 제곱에 비례하여 1/4배가 됩니다."},
{"id":6,"subject":"전력공학","question":"무부하 또는 경부하 시 송전선로의 수전단 전압이 송전단 전압보다 높아지는 페란티 현상의 주된 원인은?","choices":["선로의 저항","선로의 누설 컨덕턴스","선로의 정전용량","선로의 인덕턴스"],"answer":3,"explanation":"장거리 선로의 충전전류(진상전류)가 선로 인덕턴스를 지나며 전압 상승을 일으키는 현상으로, 원인은 선로의 정전용량입니다."},
{"id":7,"subject":"전기기기","question":"1차 전압 6600[V], 2차 전압 220[V]인 단상 변압기의 권수비는?","choices":["10","20","30","60"],"answer":3,"explanation":"권수비 a = N₁/N₂ = V₁/V₂ = 6600/220 = 30 입니다."},
{"id":8,"subject":"전기기기","question":"60[Hz], 4극 3상 유도전동기의 동기속도[rpm]는?","choices":["900","1200","1800","3600"],"answer":3,"explanation":"Ns = 120f/P = 120×60/4 = 1800[rpm] 입니다."},
{"id":9,"subject":"전기기기","question":"직류 분권전동기의 속도제어법 중 정토크 제어에 해당하는 것은?","choices":["계자 제어","전압 제어","극수 변환","주파수 제어"],"answer":2,"explanation":"직류전동기에서 전압 제어는 정토크 제어, 계자 제어는 정출력 제어 특성을 가집니다. 극수 변환과 주파수 제어는 유도전동기 방식입니다."},
{"id":10,"subject":"회로이론 및 제어공학","question":"R=3[Ω], X_L=4[Ω]인 RL 직렬회로의 임피던스 크기는?","choices":["1[Ω]","5[Ω]","7[Ω]","12[Ω]"],"answer":2,"explanation":"|Z| = √(R² + X_L²) = √(3² + 4²) = 5[Ω] 입니다."},
{"id":11,"subject":"회로이론 및 제어공학","question":"RL 직렬회로의 시정수 τ는?","choices":["R/L","L/R","RL","1/(RL)"],"answer":2,"explanation":"RL 회로의 시정수는 τ = L/R [s] 입니다. (RC 회로는 τ = RC)"},
{"id":12,"subject":"회로이론 및 제어공학","question":"전달함수 G(s) = 1/(s+2) 인 시스템에 단위계단 입력을 가했을 때 출력의 정상값(최종값)은?","choices":["0","1/2","1","2"],"answer":2,"explanation":"C(s) = 1/[s(s+2)] 이고 최종값 정리에 따라 lim s·C(s) = 1/(0+2) = 1/2 입니다."},
{"id":13,"subject":"전기설비기술기준","question":"한국전기설비규정(KEC)에서 정하는 저압의 범위는?","choices":["직류 750[V] 이하, 교류 600[V] 이하","직류 1.5[kV] 이하, 교류 1[kV] 이하","직류 1[kV] 이하, 교류 1.5[kV] 이하","직류 3[kV] 이하, 교류 1.5[kV] 이하"],"answer":2,"explanation":"KEC 전압 구분: 저압은 직류 1.5kV 이하, 교류 1kV 이하입니다. 고압은 저압을 초과하고 7kV 이하, 특고압은 7kV 초과입니다."},
{"id":14,"subject":"전기설비기술기준","question":"KEC에서 특고압으로 구분되는 전압은?","choices":["600[V] 초과","1[kV] 초과","7[kV] 초과","35[kV] 초과"],"answer":3,"explanation":"7kV를 초과하는 전압이 특고압입니다."},
{"id":15,"subject":"전기설비기술기준","question":"KEC에서 교류 3상 회로의 L1상 전선의 색상은?","choices":["갈색","흑색","회색","청색"],"answer":1,"explanation":"KEC 전선 색상: L1 갈색, L2 흑색, L3 회색, N 청색, 보호도체 녹색-노란색입니다."}
]
}
</script>

<script>
let D,Q,cfg,ans,flag,cur,left,tick,done=false,mode='exam',mem=[];
const S={mode:'exam',f:'all',n:'',rnd:true};
const $=s=>document.querySelector(s),app=$('#app');
const NUM=['①','②','③','④'],KEY='cbt-wrong-v1';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function wl(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)return v}catch(e){}return mem}
function ws(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function note(q,ok){let l=wl().filter(id=>id!==q.id);if(!ok)l.push(q.id);ws(l)}
async function load(){
  try{const r=await fetch('questions.json');if(r.ok){D=await r.json();return}}catch(e){}
  D=JSON.parse($('#qdata').textContent);
}
function pick(){
  let l=D.questions.slice();
  if(S.f.startsWith('s:'))l=l.filter(q=>q.subject===S.f.slice(2));
  else if(S.f.startsWith('t:'))l=l.filter(q=>q.type===S.f.slice(2));
  if(S.rnd)l.sort(()=>Math.random()-.5);
  const n=Math.min(Math.max(+S.n||l.length,1),l.length);
  return l.slice(0,n);
}
function start(list,m){
  mode=m;Q=list;ans=Array(Q.length).fill(0);flag=Array(Q.length).fill(false);cur=0;done=false;clearInterval(tick);
  if(m==='exam'){left=Math.max(1,Math.round(cfg.durationMin*Q.length/D.questions.length))*60;tick=setInterval(()=>{left--;updTimer();if(left<=0)submit()},1000)}
  renderExam();
}
function sv(){S.f=$('#ft').value;S.n=$('#nn').value;S.rnd=$('#rn').checked}
function home(){
  clearInterval(tick);
  const subs=[...new Set(D.questions.map(q=>q.subject))],types=[...new Set(D.questions.map(q=>q.type).filter(Boolean))];
  const w=wl().filter(id=>D.questions.some(q=>q.id===id));
  const op=(v,t)=>`<option value="${esc(v)}" ${S.f===v?'selected':''}>${esc(t)}</option>`;
  app.innerHTML=`<div class="card"><h1>${esc(cfg.title)}</h1>
  <p class="mu">전체 ${D.questions.length}문항 · 합격 기준: 평균 ${cfg.passAvg}점 이상, 과목별 ${cfg.passSubjectMin}점 이상</p>
  <h2>1. 모드</h2><div class="row"><button class="${S.mode==='exam'?'p':''}" data-m="exam">시험 모드</button><button class="${S.mode==='practice'?'p':''}" data-m="practice">연습 모드</button></div>
  <p class="mu">${S.mode==='exam'?'타이머가 작동하고, 제출 후 한꺼번에 채점합니다.':'보기를 고르면 바로 정답과 해설을 확인합니다. 시간 제한이 없습니다.'}</p>
  <h2>2. 범위</h2><select class="in" id="ft">${op('all','전체 과목')}<optgroup label="과목별">${subs.map(s=>op('s:'+s,s)).join('')}</optgroup>${types.length?`<optgroup label="유형별">${types.map(t=>op('t:'+t,t)).join('')}</optgroup>`:''}</select>
  <h2 style="margin-top:14px">3. 문항 수</h2><div class="row" style="align-items:center"><input class="in" id="nn" type="number" min="1" placeholder="전체" value="${S.n}" style="width:100px"><label><input id="rn" type="checkbox" ${S.rnd?'checked':''}> 랜덤 섞기</label></div>
  <div class="row" style="margin-top:18px"><button class="p" id="go">시작</button>
  <button id="wn" ${w.length?'':'disabled'}>오답노트 풀기 (${w.length})</button><button id="cw" ${w.length?'':'disabled'}>오답노트 비우기</button></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sv();S.mode=b.dataset.m;home()});
  $('#go').onclick=()=>{sv();start(pick(),S.mode)};
  $('#wn').onclick=()=>start(D.questions.filter(q=>w.includes(q.id)).sort(()=>Math.random()-.5),'practice');
  $('#cw').onclick=()=>{ws([]);home()};
}
function updTimer(){const t=$('#tm');if(!t)return;t.textContent=fmt(Math.max(left,0));t.classList.toggle('low',left<=300)}
function renderExam(){
  const q=Q[cur],a=ans[cur],lock=mode==='practice'&&a,pr=mode==='practice';
  app.innerHTML=`
  <div class="bar">${pr?'<div class="timer">연습 모드</div>':'<div class="timer" id="tm"></div>'}
    <div class="mu">${ans.filter(Boolean).length} / ${Q.length} 풀이</div>
    <button class="p" id="sb">${pr?'결과 보기':'답안 제출'}</button></div>
  <div class="card">
    <span class="sub">${esc(q.subject)}${q.type?' · '+esc(q.type):''}</span>
    <p class="q">${cur+1}. ${esc(q.question)}</p>
    ${q.choices.map((c,i)=>{let k='';if(lock)k=i+1===q.answer?'ok':(i+1===a?'no':'');else if(a===i+1)k='sel';return `<button class="ch ${k}" data-i="${i+1}">${NUM[i]} ${esc(c)}</button>`}).join('')}
    ${lock?`<div class="exp"><b class="${a===q.answer?'pass':'fail'}">${a===q.answer?'정답입니다':'오답입니다'}</b><br>${esc(q.explanation)}</div>`:''}
    <div class="nav"><button id="pv" ${cur===0?'disabled':''}>← 이전</button>
      ${pr?'<span></span>':`<button id="fl">${flag[cur]?'★ 표시 해제':'☆ 나중에 보기'}</button>`}
      <button id="nx" ${cur===Q.length-1?'disabled':''}>다음 →</button></div>
  </div>
  <div class="card"><h2>문제 번호</h2><div class="grid">
    ${Q.map((_,i)=>`<button data-n="${i}" class="${ans[i]?'dn':''} ${i===cur?'cur':''} ${flag[i]?'fl':''}">${i+1}</button>`).join('')}
  </div></div>`;
  updTimer();
  document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.i;
    if(pr){if(ans[cur])return;ans[cur]=v;note(q,v===q.answer)}else ans[cur]=ans[cur]===v?0:v;
    renderExam()});
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cur=+b.dataset.n;renderExam()});
  $('#pv').onclick=()=>{cur--;renderExam()};
  $('#nx').onclick=()=>{cur++;renderExam()};
  if(!pr)$('#fl').onclick=()=>{flag[cur]=!flag[cur];renderExam()};
  $('#sb').onclick=()=>{
    const un=ans.filter(a=>!a).length;
    $('#dmsg').textContent=un?`풀지 않은 문제가 ${un}개 있습니다. ${pr?'결과를 볼까요?':'제출할까요?'}`:(pr?'결과를 볼까요?':'답안을 제출할까요?');
    $('#dno').onclick=()=>$('#dlg').close();
    $('#dyes').onclick=()=>{$('#dlg').close();submit()};
    $('#dlg').showModal();
  };
}
function submit(){
  if(done)return;done=true;clearInterval(tick);
  if($('#dlg').open)$('#dlg').close();
  if(mode==='exam')Q.forEach((q,i)=>{if(ans[i])note(q,ans[i]===q.answer)});
  const subs={};
  Q.forEach((q,i)=>{const s=subs[q.subject]||(subs[q.subject]={n:0,c:0});s.n++;if(ans[i]===q.answer)s.c++});
  const rows=Object.entries(subs).map(([k,v])=>({k,n:v.n,c:v.c,sc:Math.round(v.c/v.n*1000)/10}));
  const avg=Math.round(rows.reduce((a,r)=>a+r.sc,0)/rows.length*10)/10;
  const total=ans.filter((a,i)=>a===Q[i].answer).length;
  const pass=avg>=cfg.passAvg&&rows.every(r=>r.sc>=cfg.passSubjectMin),ex=mode==='exam';
  app.innerHTML=`
  <div class="card"><h1>${ex?'채점 결과':'연습 결과'}</h1>
    <div class="score ${ex?(pass?'pass':'fail'):''}">${ex?(pass?'합격':'불합격'):avg+'점'}</div>
    <p>평균 <b>${avg}점</b> · 정답 ${total} / ${Q.length}${ex?` · 소요시간 ${fmt(Math.max(1,Math.round(cfg.durationMin*Q.length/D.questions.length))*60-Math.max(left,0))}`:''}</p>
    <table><tr><th>과목</th><th>정답</th><th>점수</th>${ex?'<th>과락</th>':''}</tr>
    ${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.c}/${r.n}</td><td>${r.sc}</td>${ex?`<td class="${r.sc<cfg.passSubjectMin?'fail':'pass'}">${r.sc<cfg.passSubjectMin?'과락':'통과'}</td>`:''}</tr>`).join('')}</table>
    <p class="mu">틀린 문제는 오답노트에 저장되었습니다. 오답노트에서 다시 맞히면 목록에서 빠집니다.</p>
    <div class="row" style="margin-top:14px"><button class="p" id="rt">처음으로</button>
    <button id="all">전체 해설</button><button id="wr">오답만 보기</button></div></div>
  <div id="rv"></div>`;
  $('#rt').onclick=home;
  $('#all').onclick=()=>review(false);$('#wr').onclick=()=>review(true);
  review(false);
}
function review(onlyWrong){
  $('#rv').innerHTML=Q.map((q,i)=>({q,i})).filter(({q,i})=>!onlyWrong||ans[i]!==q.answer).map(({q,i})=>{
    const ok=ans[i]===q.answer;
    return `<div class="card"><span class="sub">${esc(q.subject)}</span> <b class="${ok?'pass':'fail'}">${ok?'정답':ans[i]?'오답':'미응답'}</b>
    <p class="q">${i+1}. ${esc(q.question)}</p>
    ${q.choices.map((c,j)=>`<div class="ch ${j+1===q.answer?'ok':(j+1===ans[i]?'no':'')}">${NUM[j]} ${esc(c)}${j+1===q.answer?' ✔ 정답':''}${j+1===ans[i]&&!ok?' ✘ 내 답':''}</div>`).join('')}
    <div class="exp"><b>해설</b><br>${esc(q.explanation)}</div></div>`}).join('')||'<div class="card">틀린 문제가 없습니다. 🎉</div>';
}
load().then(()=>{cfg=D.config;home()});
</script>
</body>
